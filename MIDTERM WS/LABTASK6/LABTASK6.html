<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lab Task 6</title>

<link rel="stylesheet" href="style3.css">

</head>
<body>

<div class="container">

    <input type="text" placeholder="Name" class="input-block">
    <input type="email" placeholder="Email" class="input-block">

    <div class="inline-container">
        <p class="inline-text">
            Thanks for chatting with our customer support. Would you like to take our quick survey?
        </p>
        <button class="inline-btn">Yes</button>
        <button class="inline-btn">No</button>
    </div>

    <div class="google-box">
        <img src="google.png" class="google-logo">
        <br>
        <input type="text" class="search-box" placeholder="Search Google or type a URL">
    </div>

    <div class="challenge">

        <div class="signup">
            <input type="text" placeholder="First name">
            <input type="text" placeholder="Last name">
            <input type="email" placeholder="Email" class="email">
            <button>Sign Up</button>
        </div>

        <div class="uber">
            <h3>Request a ride now</h3>
            <input type="text" placeholder="Enter pickup location">
            <input type="text" placeholder="Enter destination">
            <button class="request">Request now</button>
            <button class="schedule">Schedule for later</button>
        </div>

    </div>

</div>

</body>
</html>
